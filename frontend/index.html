<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>MoneyFlow</title>
    <!-- Google Fonts for Roboto & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .MuiFormLabel-asterisk,
      .MuiInputLabel-asterisk {
        color: #d32f2f !important;
        font-weight: 700;
      }
      /* Required field validation error styles: red label, red border, red focused outline */
      .MuiFormLabel-root.Mui-error,
      .MuiInputLabel-root.Mui-error {
        color: #d32f2f !important;
      }
      .MuiOutlinedInput-root.Mui-error .MuiOutlinedInput-notchedOutline {
        border-color: #d32f2f !important;
      }
      .MuiOutlinedInput-root.Mui-error.Mui-focused .MuiOutlinedInput-notchedOutline {
        border-color: #d32f2f !important;
        border-width: 2px !important;
        box-shadow: 0 0 0 1px #d32f2f !important;
      }
      .MuiFormHelperText-root.Mui-error {
        color: #d32f2f !important;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Roboto', sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
